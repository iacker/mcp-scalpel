<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="scalpel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="saved" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrV" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="58" fill="#f8fafc" font-size="30" font-weight="700">mcp-scalpel</text>
  <text x="60" y="86" fill="#94a3b8" font-size="16">Local semantic tool-filtering proxy for the Docker MCP Gateway — no cloud, no AWS</text>

  <!-- ============ TOP ROW: THE PROBLEM ============ -->
  <text x="60" y="138" fill="#f87171" font-size="15" font-weight="700" letter-spacing="1">WITHOUT SCALPEL — full catalog re-sent every turn</text>

  <!-- Agent -->
  <g filter="url(#soft)">
    <rect x="60" y="152" rx="12" width="120" height="56" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="120" y="186" fill="#e2e8f0" font-size="15" text-anchor="middle">AI Agent</text>

  <!-- arrow -->
  <line x1="182" y1="180" x2="286" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Gateway -->
  <g filter="url(#soft)">
    <rect x="290" y="152" rx="12" width="150" height="56" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="365" y="180" fill="#e2e8f0" font-size="15" text-anchor="middle">MCP Gateway</text>
  <text x="365" y="198" fill="#64748b" font-size="12" text-anchor="middle">docker mcp gateway run</text>

  <!-- arrow to servers -->
  <line x1="442" y1="180" x2="560" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- N servers -->
  <g filter="url(#soft)"><rect x="564" y="150" rx="10" width="150" height="26" fill="#1e293b" stroke="#334155"/></g>
  <text x="574" y="168" fill="#94a3b8" font-size="12">MCP server · tools</text>
  <g filter="url(#soft)"><rect x="564" y="184" rx="10" width="150" height="26" fill="#1e293b" stroke="#334155"/></g>
  <text x="574" y="202" fill="#94a3b8" font-size="12">MCP server · tools</text>
  <text x="740" y="192" fill="#475569" font-size="18">…</text>

  <!-- cost badge -->
  <g filter="url(#soft)">
    <rect x="820" y="146" rx="12" width="240" height="70" fill="#3b0d0d" stroke="#7f1d1d"/>
  </g>
  <text x="940" y="176" fill="#fca5a5" font-size="26" font-weight="700" text-anchor="middle">18,663 tokens</text>
  <text x="940" y="198" fill="#f87171" font-size="13" text-anchor="middle">49 tools · injected on every LLM call</text>

  <!-- divider -->
  <line x1="60" y1="262" x2="1060" y2="262" stroke="#1f2937" stroke-width="1"/>

  <!-- ============ BOTTOM ROW: THE SOLUTION ============ -->
  <text x="60" y="300" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1">WITH SCALPEL — only the tools this turn needs</text>

  <!-- Agent -->
  <g filter="url(#soft)">
    <rect x="60" y="330" rx="12" width="120" height="56" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="120" y="364" fill="#e2e8f0" font-size="15" text-anchor="middle">AI Agent</text>

  <line x1="182" y1="358" x2="268" y2="358" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SCALPEL proxy (hero) -->
  <g filter="url(#soft)">
    <rect x="272" y="322" rx="14" width="176" height="72" fill="url(#scalpel)"/>
  </g>
  <text x="360" y="352" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">mcp-scalpel</text>
  <text x="360" y="372" fill="#e0e7ff" font-size="12" text-anchor="middle">stdio proxy · filters tools/list</text>

  <line x1="450" y1="358" x2="536" y2="358" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Gateway -->
  <g filter="url(#soft)">
    <rect x="540" y="330" rx="12" width="150" height="56" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="615" y="358" fill="#e2e8f0" font-size="15" text-anchor="middle">MCP Gateway</text>
  <text x="615" y="376" fill="#64748b" font-size="12" text-anchor="middle">49 tools upstream</text>

  <!-- saved badge -->
  <g filter="url(#soft)">
    <rect x="820" y="324" rx="12" width="240" height="70" fill="#052e2b" stroke="#065f46"/>
  </g>
  <text x="940" y="354" fill="#6ee7b7" font-size="26" font-weight="700" text-anchor="middle">8,977 tokens</text>
  <text x="940" y="376" fill="#34d399" font-size="13" text-anchor="middle">16 tools · 52% saved every turn</text>

  <!-- saved flow arrow -->
  <path d="M690,352 C750,340 770,340 816,346" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <!-- feed-back: session context -->
  <path d="M360,394 C360,430 360,430 360,452" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- feature chips -->
  <g filter="url(#soft)"><rect x="90" y="452" rx="10" width="228" height="52" fill="#1e1b4b" stroke="#4338ca"/></g>
  <text x="204" y="474" fill="#c7d2fe" font-size="13" font-weight="600" text-anchor="middle">Session context</text>
  <text x="204" y="492" fill="#818cf8" font-size="11" text-anchor="middle">task hint + recent tool calls</text>

  <g filter="url(#soft)"><rect x="336" y="452" rx="10" width="248" height="52" fill="#1e1b4b" stroke="#4338ca"/></g>
  <text x="460" y="474" fill="#c7d2fe" font-size="13" font-weight="600" text-anchor="middle">Progressive disclosure</text>
  <text x="460" y="492" fill="#818cf8" font-size="11" text-anchor="middle">scalpel_search_tools() reveals on demand</text>

  <g filter="url(#soft)"><rect x="602" y="452" rx="10" width="210" height="52" fill="#1e1b4b" stroke="#4338ca"/></g>
  <text x="707" y="474" fill="#c7d2fe" font-size="13" font-weight="600" text-anchor="middle">Safety net</text>
  <text x="707" y="492" fill="#818cf8" font-size="11" text-anchor="middle">falls back to full catalog</text>

  <g filter="url(#soft)"><rect x="830" y="452" rx="10" width="176" height="52" fill="#052e2b" stroke="#065f46"/></g>
  <text x="918" y="474" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle">Zero cloud</text>
  <text x="918" y="492" fill="#34d399" font-size="11" text-anchor="middle">pure-numpy, ms latency</text>

  <!-- footer measured note -->
  <text x="60" y="560" fill="#64748b" font-size="13">Measured on a live Docker MCP Gateway (49 tools). A stdio proxy never sees the prompt — so scalpel routes from session context, not the user query.</text>
  <text x="60" y="582" fill="#475569" font-size="12">MIT · github.com/iacker/mcp-scalpel</text>
</svg>
